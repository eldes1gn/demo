<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tort sifarişi</title>

  <!-- ===== Для режима «приложения» (PWA) ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3ECE4">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ===== Шрифты: Fraunces (заголовки), Manrope (текст) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== ВЕРХНЯЯ ПАНЕЛЬ ===================== -->
  <header class="appbar">
    <img id="logo" src="" alt="">
    <span id="company-name"></span>
    <div id="lang-switch" role="group" aria-label="Language">
      <button data-lang="az">AZ</button>
      <button data-lang="ru">RU</button>
    </div>
  </header>

  <div class="layout">

    <!-- ===================== ВИТРИНА: выбранный торт ===================== -->
    <!-- На телефоне — сверху, на компьютере — слева и не уезжает при прокрутке -->
    <aside class="showcase">
      <figure class="hero">
        <img id="hero-img" src="" alt="">
      </figure>
      <div class="hero-text">
        <h1 id="hero-name"></h1>
        <p id="hero-about"></p>
      </div>
    </aside>

    <!-- ===================== ШАГИ ЗАКАЗА ===================== -->
    <main class="steps">

      <!-- ШАГ 1: торт -->
      <section id="step-cake" class="step">
        <h2><span class="num">1</span><span data-i18n="step1">Tortu seçin</span></h2>
        <!-- app.js выведет сюда 10 тортов (на телефоне листаются вбок) -->
        <div id="cake-list" class="cake-strip"></div>
      </section>

      <!-- ШАГ 2: вес -->
      <section id="step-size" class="step">
        <h2><span class="num">2</span><span data-i18n="step2">Çəkini seçin</span></h2>
        <!-- app.js выведет сюда круги: чем больше вес, тем больше круг -->
        <div id="size-list" class="size-scale"></div>
      </section>

      <!-- ШАГ 3: дизайн -->
      <section id="step-design" class="step">
        <h2><span class="num">3</span><span data-i18n="step3">Dizayn</span></h2>
        <div id="design-list" class="segmented"></div>
      </section>

      <!-- ШАГ 4: детали -->
      <section id="step-details" class="step">
        <h2><span class="num">4</span><span data-i18n="step4">Detallar</span></h2>

        <div class="field">
          <label for="inscription" data-i18n="inscription">Tortun üzərində yazı</label>
          <input type="text" id="inscription" autocomplete="off">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date" data-i18n="date">Tarix</label>
            <input type="date" id="date">
          </div>
          <div class="field">
            <label for="customer-name" data-i18n="name">Adınız</label>
            <input type="text" id="customer-name" autocomplete="given-name">
          </div>
        </div>

        <div class="field">
          <span class="label" data-i18n="branch">Filial (özün götür)</span>
          <!-- app.js выведет сюда 4 филиала карточками -->
          <div id="branch-list" class="branches" role="radiogroup"></div>
        </div>
      </section>

      <!-- ШАГ 5: проверка заказа -->
      <section id="step-summary" class="step">
        <h2><span class="num">5</span><span data-i18n="step5">Sifariş</span></h2>
        <div id="summary" class="receipt"></div>
        <p class="note" data-i18n="note"></p>
        <p id="error" class="error" role="alert"></p>
      </section>
    </main>
  </div>

  <!-- ===================== НИЖНЯЯ ПАНЕЛЬ: цена-печать и кнопка ===================== -->
  <footer class="orderbar">
    <div class="orderbar-inner">
      <!-- Оранжевая «печать», как медальон TORTE на их тортах -->
      <div class="seal" id="seal" aria-live="polite">
        <small class="seal-label" data-i18n="approx">təxmini</small>
        <span id="total">—</span>
      </div>
      <div class="orderbar-text">
        <span class="note" data-i18n="total">Təxmini qiymət</span>
        <span id="total-line"></span>
      </div>
      <button id="send-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
        <span data-i18n="send">WhatsApp-a göndər</span>
      </button>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
